# MQTT TCP Stream Configuration
# This file should be included in the main /etc/nginx/nginx.conf
# Add this line in nginx.conf: include /etc/nginx/stream.d/*.conf;

# MQTT over TLS
# Accessible via: mqtts://core.nokotoys.com:8883
server {
    listen 8883 ssl;
    listen [::]:8883 ssl;

    ssl_certificate /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Proxy to local MQTT broker
    proxy_pass 127.0.0.1:1883;
    proxy_connect_timeout 5s;
}

# MQTT without TLS - Direct access to Mosquitto
# Mosquitto already listens on port 1883, no nginx proxy needed
# Clients can connect directly to: mqtt://core.nokotoys.com:1883
# (If using Cloudflare DNS, set to "DNS only" not proxied)

